<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Babylon — pipeline & превью</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

<main class="app-main">

  <section id="view-dashboard" class="dashboard-grid">

    <aside class="dash-col dash-left">
      <div class="card card--compact card--toolbar">
        <div class="side-toolbar-brand">
          <div class="logo">
            <div class="logo-mark" aria-hidden="true"></div>
            <span class="logo-text">BABYLON<span>_</span>PIPE</span>
          </div>
        </div>
        <div class="side-shortcuts" id="shortcutsBar" aria-label="Горячие клавиши">
          <div class="shortcut-row"><kbd class="shortcut-kbd">N</kbd><span class="shortcut-label">сброс пальцев</span></div>
          <div class="shortcut-row"><kbd class="shortcut-kbd">T</kbd><span class="shortcut-label">тема</span></div>
          <div class="shortcut-row"><kbd class="shortcut-kbd">?</kbd><span class="shortcut-label">подсказка</span></div>
          <div class="shortcut-row"><kbd class="shortcut-kbd shortcut-kbd--wide">Ctrl+Z</kbd><span class="shortcut-label">отмена / повтор</span></div>
          <div class="shortcut-row"><kbd class="shortcut-kbd">F</kbd><span class="shortcut-label">на весь экран</span></div>
        </div>
        <div class="side-toolbar-tools">
          <button type="button" class="btn btn-ghost" data-action="toggle-theme" title="Тема (T)">тема</button>
        </div>
        <div class="side-toolbar-status">
          <span class="status-dot" title="сессия"><span class="dot" aria-hidden="true"></span> сессия</span>
        </div>
      </div>

      <div class="card card--compact" id="fingerPanel">
        <div class="card-header">
          <div>
            <div class="card-meta">поза</div>
            <div class="card-title">Сгиб пальцев</div>
          </div>
          <span class="pill">0–100%</span>
        </div>
        <p class="card-hint card-hint--tight">Угол/ход условно в % → в <code>pipeline.handPose</code> в экспорте.</p>
        <div class="finger-list" id="fingerList">
          <label class="finger-row" data-finger-name="большой">
            <span class="finger-idx">1</span>
            <span class="finger-label">большой</span>
            <span class="finger-out">0</span>
            <input id="f0" class="finger-range" type="range" min="0" max="100" value="0" data-finger="0" />
          </label>
          <label class="finger-row" data-finger-name="указат.">
            <span class="finger-idx">2</span>
            <span class="finger-label">указат.</span>
            <span class="finger-out">0</span>
            <input id="f1" class="finger-range" type="range" min="0" max="100" value="0" data-finger="1" />
          </label>
          <label class="finger-row" data-finger-name="средний">
            <span class="finger-idx">3</span>
            <span class="finger-label">средний</span>
            <span class="finger-out">0</span>
            <input id="f2" class="finger-range" type="range" min="0" max="100" value="0" data-finger="2" />
          </label>
          <label class="finger-row" data-finger-name="безым.">
            <span class="finger-idx">4</span>
            <span class="finger-label">безым.</span>
            <span class="finger-out">0</span>
            <input id="f3" class="finger-range" type="range" min="0" max="100" value="0" data-finger="3" />
          </label>
          <label class="finger-row" data-finger-name="мизинец">
            <span class="finger-idx">5</span>
            <span class="finger-label">мизинец</span>
            <span class="finger-out">0</span>
            <input id="f4" class="finger-range" type="range" min="0" max="100" value="0" data-finger="4" />
          </label>
        </div>
        <div class="sliders-actions sliders-actions--tight">
          <button type="button" class="btn" data-hand-action="pose-reset" title="Все в ноль">сброс 0</button>
        </div>
      </div>

      <div class="card card--compact hand-json-card">
        <div class="card-header">
          <div>
            <div class="card-meta">импорт</div>
            <div class="card-title">JSON позы</div>
          </div>
        </div>
        <p class="card-hint card-hint--tight">Полный экспорт или <code>pipeline.handPose.values</code> (5 чисел).</p>
        <div class="sliders-actions sliders-actions--tight" style="margin-top:4px">
          <label class="btn btn-block">загрузить .json
            <input id="handPoseJsonInput" type="file" accept=".json,application/json" class="sr-only">
          </label>
        </div>
      </div>

      <div class="card card--compact snake-card" id="snakeGameRoot" tabindex="0" aria-label="Змейка"></div>
    </aside>

    <section class="dash-scene" aria-label="3D">
      <div class="scene-area scene-area--fill">
        <div class="scene-loading" id="sceneLoading" aria-live="polite" aria-busy="false" role="status">
          <div class="scene-loading-inner">загрузка…</div>
        </div>
        <div class="scene-fps" id="fpsCounter">—</div>
        <canvas id="dashboardCanvas" data-engine-canvas></canvas>
      </div>
      <div class="scene-toolbar">
        <button type="button" class="btn" data-dash-action="reload-assembly" title="Перезагрузить GLB">⟳</button>
        <label class="btn">json
          <input id="dashAssemblyJsonInput" type="file" accept=".json,application/json" class="sr-only">
        </label>
        <button type="button" class="btn" data-dash-action="reset-cam" title="Камера">⌖</button>
        <button type="button" class="btn" data-dash-action="stop-clip" title="Стоп">⏹</button>
        <button type="button" class="btn" data-dash-action="fullscreen" title="F">⛶</button>
      </div>
    </section>

    <aside class="dash-col dash-right">
      <div class="card card--compact card--export">
        <div class="card-header">
          <div>
            <div class="card-meta">экспорт</div>
            <div class="card-title">Полный JSON</div>
          </div>
          <div id="recipeStats" class="recipe-statline" aria-live="polite">—</div>
        </div>
        <div class="divider"></div>
        <div class="send-area send-area--export">
          <textarea id="recipeOutput" placeholder="// handPose + assembly…" spellcheck="false" aria-label="экспорт"></textarea>
          <div class="recipe-statline recipe-statline--tight">
            <span id="recipeStatus" style="color:var(--accent)">—</span>
          </div>
          <div class="send-actions send-actions--export">
            <div class="export-group">
              <button type="button" class="btn" data-recipe-action="export-json">.json</button>
              <button type="button" class="btn" data-recipe-action="export-txt">.txt</button>
            </div>
            <button type="button" class="btn btn-primary" data-recipe-action="refresh-output">↻</button>
          </div>
        </div>
      </div>
    </aside>

  </section>
</main>

</body>
</html>
